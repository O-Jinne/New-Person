<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>새사람 프로젝트</title>
<script>
(function () {
  var saved = localStorage.getItem("monster-project-theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
})();
</script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header>
    <div class="header-top">
      <h1><svg class="icon icon-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></svg>새사람 프로젝트</h1>
      <div class="header-icons">
        <button id="theme-toggle-btn" class="profile-icon-btn" data-icon-state="dark" aria-label="다크/라이트 테마 전환">
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <button id="tip-btn" class="profile-icon-btn" aria-label="이용 팁 보기"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></button>
        <button id="profile-btn" class="profile-icon-btn" aria-label="내 프로필 열기"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
      </div>
    </div>
    <p id="today-date"></p>
  </header>

  <div class="screens">

    <section id="screen-history" class="screen active screen-history-split">
      <div class="history-top" id="history-profile-summary"></div>

      <div class="history-bottom">
        <div class="calendar-header">
          <button id="prev-month" class="cal-nav-btn" aria-label="이전 달">‹</button>
          <h2 id="calendar-title">운동 기록</h2>
          <button id="next-month" class="cal-nav-btn" aria-label="다음 달">›</button>
        </div>

        <div class="calendar-weekdays">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>

        <div id="calendar-grid" class="calendar-grid"></div>

        <div id="day-detail" class="day-detail"></div>
      </div>
    </section>

    <section id="screen-workout" class="screen">
      <div class="type-select">
        <button class="type-tab" data-type="gym"><svg class="icon icon-type" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></svg><br>기구</button>
        <button class="type-tab" data-type="bodyweight"><svg class="icon icon-type" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg><br>맨몸</button>
        <button class="type-tab" data-type="rest"><svg class="icon icon-type" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg><br>휴식</button>
      </div>

      <div id="rest-only-group" class="rest-only-group">
        <button id="rest-day-btn" class="primary-btn">오늘은 휴식일로 저장</button>
      </div>

      <div id="workout-detail-group" class="workout-detail-group">
        <div id="workout-setup-view">
          <nav class="day-tabs">
            <button class="day-tab" data-day="1">1</button>
            <button class="day-tab" data-day="2">2</button>
            <button class="day-tab" data-day="3">3</button>
            <button class="day-tab" data-day="4">4</button>
          </nav>

          <div class="day-routine-caption-row">
            <p id="day-routine-caption" class="day-routine-caption"></p>
            <button id="reroll-rotation-btn" class="reroll-btn" title="보조 운동 다시 뽑기" aria-label="보조 운동 다시 뽑기"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg> 새로고침</button>
          </div>

          <div id="editing-banner" class="editing-banner">
            <span id="editing-banner-text"></span>
            <button id="fill-all-btn" class="fill-all-btn">전체 빠른 채우기</button>
            <button id="cancel-edit-btn">취소</button>
          </div>

          <main id="routine-view"></main>

          <button id="start-workout-btn" class="primary-btn">운동 시작 ▶</button>

          <div class="setup-btn-row">
            <button id="add-exercise-btn" class="secondary-btn">+ 운동 추가</button>
            <button id="save-log-btn" class="secondary-btn">기록 편집</button>
          </div>
        </div>

        <div id="hero-session" class="hero-session">
          <div class="hero-timer-row">
            <span id="hero-timer" class="hero-timer">00:00</span>
            <button id="finish-workout-btn" class="hero-finish-btn">종료 · 저장</button>
          </div>

          <div id="hero-chip-strip" class="chip-strip"></div>

          <div id="hero-card" class="hero-card"></div>
        </div>
      </div>
    </section>

  </div>

  <nav class="bottom-nav">
    <button class="nav-tab active" data-screen="screen-history">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="nav-label">기록</span>
    </button>
    <button class="nav-tab" data-screen="screen-workout">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 6.5 L17.5 17.5"/><path d="M21 21l-1.5-1.5"/><path d="M3 3l1.5 1.5"/><path d="M18 22l4-4"/><path d="M2 6l4-4"/><path d="M3 10l7-7"/><path d="M14 21l7-7"/></svg>
      <span class="nav-label">오늘의 운동</span>
    </button>
  </nav>
</div>

<div id="exercise-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="sheet-handle"></div>
    <div class="modal-header">
      <input type="text" id="exercise-search" placeholder="운동 이름 검색 (예: 벤치)" autocomplete="off">
      <button id="close-modal-btn" class="modal-close" aria-label="운동 검색 닫기"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div id="exercise-list" class="modal-list"></div>
  </div>
</div>

<div id="profile-modal" class="modal-overlay center">
  <div class="modal-box">
    <div class="sheet-handle"></div>
    <div class="modal-header">
      <h3 class="modal-title">내 프로필</h3>
      <button id="close-profile-btn" class="modal-close" aria-label="프로필 닫기"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="profile-form">
      <label>이름</label>
      <input type="text" id="profile-name" placeholder="이름">

      <div class="profile-row">
        <div>
          <label>키 (cm)</label>
          <input type="number" id="profile-height" placeholder="170">
        </div>
        <div>
          <label>몸무게 (kg)</label>
          <input type="number" id="profile-weight" placeholder="65">
        </div>
      </div>

      <label>성별</label>
      <div class="segmented-control" id="gender-select">
        <button type="button" class="segmented-btn" data-gender="male">남성</button>
        <button type="button" class="segmented-btn" data-gender="female">여성</button>
      </div>

      <label>목표 모드</label>
      <div class="segmented-control" id="goalmode-select">
        <button type="button" class="segmented-btn" data-goalmode="bulk">벌크업</button>
        <button type="button" class="segmented-btn" data-goalmode="balance">균형</button>
        <button type="button" class="segmented-btn" data-goalmode="cut">감량</button>
      </div>

      <button id="save-profile-btn" class="primary-btn">저장</button>

      <div id="profile-result" class="profile-result"></div>

      <div class="backup-row">
        <button id="export-data-btn" class="backup-btn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg> 데이터 내보내기</button>
        <button id="import-data-btn" class="backup-btn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg> 가져오기</button>
        <input type="file" id="import-file-input" accept=".json" style="display:none;">
      </div>
    </div>
  </div>
</div>

<div id="tip-modal" class="modal-overlay center">
  <div class="modal-box">
    <div class="sheet-handle"></div>
    <div class="modal-header">
      <h3 class="modal-title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg> Tip</h3>
      <button id="close-tip-btn" class="modal-close" aria-label="팁 닫기"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="tip-list">
      <div class="tip-item">
        <span class="tip-num">1</span>
        <span>프로필을 클릭해서 본인의 정보를 입력하고 운동 기록을 관리해주세요.</span>
      </div>
      <div class="tip-item">
        <span class="tip-num">2</span>
        <span>3~4일 운동 후에는 반드시 하루 휴식해주세요.</span>
      </div>
      <div class="tip-item">
        <span class="tip-num">3</span>
        <span>운동만큼 수면과 식사도 중요해요. 잘 자고 잘 먹어야 근육이 자랍니다.</span>
      </div>
    </div>
  </div>
</div>

<div id="exercise-info-modal" class="modal-overlay center">
  <div class="modal-box">
    <div class="sheet-handle"></div>
    <div class="modal-header">
      <h3 class="modal-title" id="exercise-info-title">운동 설명</h3>
      <button id="close-exercise-info-btn" class="modal-close" aria-label="운동 설명 닫기"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div id="exercise-info-body" class="exercise-info-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
